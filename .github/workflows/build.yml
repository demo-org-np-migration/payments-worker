name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/demo-org-np-migration/payments-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest

  update-gitops-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump staging image tag
        working-directory: gitops
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          yq -i '.image.tag = strenv(SHA_TAG)' apps/payments-worker/values-staging.yaml
          git config user.name "cauri-bot"
          git config user.email "cauri-bot@cauri.io"
          git add apps/payments-worker/values-staging.yaml
          git commit -m "chore(payments-worker): staging ${SHA_TAG}"
          for _ in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then break; fi
            sleep $((RANDOM % 5 + 2))
          done
  update-gitops-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: demo-org-np-migration/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Bump prod image tag
        working-directory: gitops
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          yq -i '.image.tag = strenv(SHA_TAG)' apps/payments-worker/values-prod.yaml
          git config user.name "cauri-bot"
          git config user.email "cauri-bot@cauri.io"
          git add apps/payments-worker/values-prod.yaml
          git commit -m "chore(payments-worker): prod ${SHA_TAG}"
          for _ in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then break; fi
            sleep $((RANDOM % 5 + 2))
          done