server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SERVICE_NAME:payments-worker}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:payments}
    username: ${DB_USER:cauri}
    password: ${DB_PASSWORD:cauri}
  jpa:
    hibernate:
      # payments-worker es dueño solo de `settlements`; Flyway maneja el DDL, Hibernate no lo toca.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

kafka:
  topic-prefix: ${KAFKA_TOPIC_PREFIX:staging.}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  sqs:
    queue-name: ${SQS_QUEUE_PREFIX:staging-}notifications

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
