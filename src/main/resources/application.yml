server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SERVICE_NAME:payments-worker}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:payments}
    username: ${DB_USER:cauri}
    password: ${DB_PASSWORD:cauri}
  jpa:
    hibernate:
      # payments-worker es dueño solo de `settlements`; Flyway maneja el DDL, Hibernate no lo toca.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # `payments` es la base de payments-api, no nuestra: comparte flyway_schema_history con
    # nosotros por default y valida las dos secuencias de migraciones como si fueran una sola
    # (mismo V1, checksum distinto) => el segundo en arrancar muere con FlywayValidateException.
    # Historia propia para no invadir la de payments-api.
    table: flyway_schema_history_worker
    # Con historia propia, la primera vez que corremos acá el schema "public" ya no está vacío
    # (payments-api ya creó sus tablas) pero flyway_schema_history_worker todavía no existe: sin
    # esto Flyway rechaza migrar con "Found non-empty schema(s) but no schema history table".
    # baseline-on-migrate crea nuestra propia historia con baseline 0 y aplica V1 encima; no toca
    # nada de lo que ya existe (nuestro V1 usa IF NOT EXISTS).
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

kafka:
  topic-prefix: ${KAFKA_TOPIC_PREFIX:staging.}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  sqs:
    queue-name: ${SQS_QUEUE_PREFIX:staging-}notifications

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
